name: Dig protocol layer (temp)

# TEMPORARY dig (delete after use). Re-decompiles the 8 dex files under re/ with
# jadx on a cloud runner and pulls the protocol layer that the Smart Dial deep
# dive still needs:
#   - EspeonSppProtocol / EspeonProtocol bodies (setGestureData route)
#   - TWSDevice / TWSDeviceBuilder internals (syncSet/sendCommandsMessage framing,
#     seq, checksum, encryption, transport)
#   - DataExtKt.toMultiValues / toInt (read-back signedness for op 255)
#   - keyConfiguration(/BaseSppProtocol/DeviceProtocol full context
# It uploads every matched Java file as an artifact for reading.

on:
  workflow_dispatch:

jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Unpack dex files
        run: |
          mkdir -p /tmp/source
          cd /tmp/source
          unzip -o "$GITHUB_WORKSPACE/re/nothing-x-dex.zip"

      - name: Download jadx
        run: |
          curl -sL -o /tmp/jadx.zip \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx

      - name: Decompile dex to Java source
        run: |
          /tmp/jadx/bin/jadx -d /tmp/jadx-out \
            --no-res --escape-unicode --show-bad-code --threads-count 4 \
            /tmp/source/classes*.dex 2>&1 | tail -5
          COUNT=$(find /tmp/jadx-out -name '*.java' | wc -l)
          echo "jadx produced $COUNT java files"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::decompile produced no output"
            exit 1
          fi

      - name: Collect Utils / XConnector files
        run: |
          SRC=/tmp/jadx-out/sources
          OUT=/tmp/artifacts
          mkdir -p "$OUT"
          find "$SRC" -type f -name '*.java' \( \
            -path '*/com/nothing/base/util/*' -o \
            -path '*/com/nothing/link/bluetooth/sdk/*' -o \
            -name 'Utils.java' -o \
            -name 'XConnector.java' -o \
            -name 'XDefaultParser.java' -o \
            -name 'XCommand.java' -o \
            -name 'XWriteCallback.java' -o \
            -name 'XBluetoothManager.java' \
          \) | sort > "$OUT/proto2-files.txt.by-name"
          grep -rlE 'obtainCrc16|writeWithTask|class XDefaultParser|parseRawData|XCommand' \
            "$SRC" --include='*.java' | sort > "$OUT/proto2-files.txt.by-content"
          cat "$OUT/proto2-files.txt.by-name" "$OUT/proto2-files.txt.by-content" \
            | sort -u > "$OUT/proto2-files.txt"
          echo "proto2-matched: $(wc -l < "$OUT/proto2-files.txt")"
          while read -r f; do
            rel="${f#$SRC/}"
            mkdir -p "$OUT/proto2-src/$(dirname "$rel")"
            cp "$f" "$OUT/proto2-src/$rel"
          done < "$OUT/proto2-files.txt"

      - name: Print Utils / XConnector findings
        run: |
          SRC=/tmp/jadx-out/sources
          echo "########## Utils.obtainCrc16 ##########"
          rg -n "obtainCrc16|CRC|0x1021|0x8005|0xA001|poly|table" \
            "$SRC/com/nothing/base/util" --glob 'Utils*.java' 2>/dev/null | head -120 || true
          echo
          echo "########## XConnector.writeWithTask ##########"
          rg -n "writeWithTask|parseRawData|XDefaultParser|splitPacket|adapter|rawData|onParse|calcu|checksum" \
            "$SRC/com/nothing/link" --glob '*.java' 2>/dev/null | head -220 || true

      - name: Package matched source
        run: |
          cd /tmp/artifacts
          tar czf dig-proto2.tar.gz proto2-src proto2-files.txt 2>/dev/null
          echo "archive: $(du -h dig-proto2.tar.gz | cut -f1)"

      - name: Upload matched source bundle
        uses: actions/upload-artifact@v4
        with:
          name: dig-proto2
          path: /tmp/artifacts/dig-proto2.tar.gz
          retention-days: 14